# OPTIONAL FALLBACK. Local development uses the PostgreSQL 18 service installed on
# the host, not this container — see .env.example. Keep this file for a machine with
# no Postgres installed, or to get a throwaway database that can be dropped wholesale
# while iterating on the seed generator.
#
# Defaults to port 5433 because the host service already holds 5432, so both can run
# side by side without a conflict.
services:
  db:
    image: postgres:16-alpine
    container_name: people-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-people}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-people}
      POSTGRES_DB: ${POSTGRES_DB:-people_analytics}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-people} -d ${POSTGRES_DB:-people_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
